<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>大肥鱼</title>
<style>
:root{
  --bg:#0b0e14;--panel:#101820;--panel2:#151d28;--line:#273040;
  --text:#e6edf3;--dim:#8b98a9;--accent:#4da3ff;--me:#1d4f91;--her:#1a2432;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.6 "Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg,#131c28,#0f1620);
  border-bottom:1px solid var(--line);
}
header img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid #2b3b50}
.who{flex:1;min-width:0}
.who h1{font-size:18px;line-height:1.2;margin:0;font-weight:600;letter-spacing:.5px}
.who .sub{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:#d29922;box-shadow:0 0 8px #d29922}
.dot.on{background:#3fb950;box-shadow:0 0 8px #3fb950}
.dot.off{background:#f85149;box-shadow:0 0 8px #f85149}
#gear,#galleryBtn,#bootBtn{background:none;border:0;color:var(--dim);font-size:21px;padding:6px;cursor:pointer}
#bootBtn{
  color:#7ee2a8;font-size:12px;font-weight:600;padding:7px 8px;
  border:1px solid #2f7a4f;border-radius:10px;line-height:1;
}
#attach{
  flex:0 0 auto;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel2);color:var(--text);font-size:19px;line-height:1;cursor:pointer;
}
#attach:disabled{opacity:.45}
#fileInput{display:none}
#splash{
  position:fixed;inset:0;z-index:100;background:#0b0e14;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s ease;
}
#splash.hidden{opacity:0;pointer-events:none}
#splash img{
  width:min(78vw,560px);height:auto;border-radius:28px;
  box-shadow:0 24px 80px rgba(47,107,255,.32);
}
header img{cursor:pointer}
.gallery-panel{
  position:fixed;inset:0;z-index:50;background:rgba(8,11,16,.96);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);
}
.gallery-panel.hidden{display:none}
.gallery-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--line);color:var(--text);
  font-size:16px;font-weight:600;
}
.gallery-head button{background:none;border:0;color:var(--dim);font-size:28px;line-height:1;padding:0 4px}
.gallery-grid{
  flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;padding:12px;
}
.gallery-grid img{
  width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;
  border:2px solid transparent;background:#151d28;
}
.gallery-grid img.active{border-color:var(--accent)}
.gallery-foot{
  flex:0 0 auto;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  color:var(--dim);font-size:10px;line-height:1.5;border-top:1px solid var(--line);
}
.settings-panel{
  position:fixed;inset:0;z-index:60;background:rgba(8,11,16,.92);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.settings-panel.hidden{display:none}
.settings-card{
  width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.settings-head strong{font-size:19px}
.settings-head button{background:none;border:0;color:var(--dim);font-size:26px;line-height:1}
.settings-card label{display:block;color:var(--dim);font-size:12px;margin:12px 0 6px}
.settings-card input{
  width:100%;height:44px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel2);color:var(--text);padding:0 12px;font:inherit;outline:none;
}
.settings-card input:focus{border-color:#2b5c8f}
.settings-actions{display:flex;gap:8px;margin-top:10px}
.settings-actions button{
  flex:1;height:42px;border:0;border-radius:10px;background:var(--accent);
  color:#04101f;font-weight:700;font-size:14px;
}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
}
.settings-row strong{font-size:16px}
.settings-row .hint{font-size:11px;color:var(--dim);margin-top:3px}
#bootToggle{
  min-width:96px;height:40px;border-radius:20px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font-weight:600;font-size:14px;
}
#bootToggle.on{background:#173d2a;border-color:#2f7a4f;color:#7ee2a8}
.settings-note{color:var(--dim);font-size:11px;line-height:1.5;margin-top:12px}
main{
  flex:1 1 auto;overflow-y:auto;padding:14px 12px 6px;
  display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;
}
.row{display:flex;width:100%}
.row.me{justify-content:flex-end}
.bubble{
  max-width:84%;padding:9px 12px;border-radius:14px;
  white-space:pre-wrap;word-break:break-word;font-size:14.5px;
  border:1px solid var(--line);background:var(--her);
}
.row.me .bubble{background:var(--me);border-color:#2b5c8f}
.time{font-size:10px;color:var(--dim);margin-top:4px;text-align:right}
.hint{color:var(--dim);font-size:12px;text-align:center;padding:10px 0}
footer{
  flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line);
}
#input{
  flex:1;min-height:42px;max-height:110px;resize:none;border:1px solid var(--line);
  border-radius:12px;background:var(--panel2);color:var(--text);
  padding:10px 12px;font:inherit;outline:none;
}
#input:focus{border-color:#2b5c8f}
#send{
  flex:0 0 auto;height:42px;padding:0 16px;border:0;border-radius:12px;
  background:var(--accent);color:#04101f;font-weight:700;font-size:14px;
}
#send:disabled{opacity:.45}
</style>
</head>
<body>
<div id="splash"><img src="main-visual.png" alt="大肥鱼"></div>
<header>
  <img id="avatar" src="avatar.jpg" alt="大肥鱼" title="点一下换一张">
  <div class="who">
    <h1>大肥鱼</h1>
    <div class="sub"><span id="dot" class="dot"></span><span id="status">连接中…</span></div>
  </div>
  <button id="bootBtn" title="开机自启">开机</button>
  <button id="galleryBtn" title="立绘">🖼</button>
  <button id="gear" title="设置">⚙</button>
</header>
<div id="galleryPanel" class="gallery-panel hidden">
  <div class="gallery-head"><span>大肥鱼的立绘 · 93</span><button id="galleryClose" title="关闭">×</button></div>
  <div id="galleryGrid" class="gallery-grid"></div>
  <div class="gallery-foot">
    素材：AATINF/deepseek-whale-girl-assets（93 张分享版）<br>
    角色参考：TreapGoGo/deepseek-whale-girl（MIT License）
  </div>
</div>
<div id="settingsPanel" class="settings-panel hidden">
  <div class="settings-card">
    <div class="settings-head"><strong>设置</strong><button id="settingsClose" title="关闭">×</button></div>
    <label for="settingsTopic">ntfy topic</label>
    <input id="settingsTopic" placeholder="dafeiyu-..." autocomplete="off">
    <div class="settings-actions"><button id="settingsSaveTopic">保存 topic</button></div>
    <div class="settings-row">
      <div>
        <strong>开机自启</strong>
        <div class="hint">下次重启生效</div>
      </div>
      <button id="bootToggle">开启</button>
    </div>
    <div id="bootState" class="settings-note">需要 AutoX 自启动权限；开启后重启手机，本鱼会自己回来。</div>
    <div class="settings-note">开关通过 ntfy 发给手机上的 agent。没有 topic 时先填 topic。</div>
  </div>
</div>
<main id="messages"></main>
<footer>
  <button id="attach" title="上传图片">📎</button>
  <input type="file" id="fileInput" accept="image/*">
  <textarea id="input" rows="1" placeholder="和她说点什么…"></textarea>
  <button id="send">发送</button>
</footer>

<script src="gallery.js"></script>
<script>
(function(){
  var DEFAULT_TOPIC = "";
  var topic = localStorage.getItem("dafeiyu_topic") || DEFAULT_TOPIC;
  var lastId = localStorage.getItem("dafeiyu_last_id") || "10m";
  var messages = [];
  try { messages = JSON.parse(localStorage.getItem("dafeiyu_msgs") || "[]"); } catch(e) { messages = []; }
  if (!messages.length) {
    messages.push({
      role:"assistant",
      text: topic ? "本鱼在呢。今天想聊点啥？🐋" :
        "先点右上角 ⚙，把手机上 agent 的 ntfy topic 填进来。\ntopic 在 /sdcard/DeepSeekGirl/remote/topic.txt。",
      ts:Date.now()/1000
    });
  }

  var main = document.getElementById("messages");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var attach = document.getElementById("attach");
  var fileInput = document.getElementById("fileInput");
  var dot = document.getElementById("dot");
  var statusEl = document.getElementById("status");
  var avatarEl = document.getElementById("avatar");
  var galleryPanel = document.getElementById("galleryPanel");
  var galleryGrid = document.getElementById("galleryGrid");
  var galleryBtn = document.getElementById("galleryBtn");
  var galleryClose = document.getElementById("galleryClose");
  var settingsPanel = document.getElementById("settingsPanel");
  var settingsTopic = document.getElementById("settingsTopic");
  var settingsClose = document.getElementById("settingsClose");
  var settingsSaveTopic = document.getElementById("settingsSaveTopic");
  var bootToggle = document.getElementById("bootToggle");
  var bootState = document.getElementById("bootState");
  var bootBtn = document.getElementById("bootBtn");
  var GALLERY = (window.DAFEIYU_GALLERY || ["C01.jpg"]);
  var avatarIndex = parseInt(localStorage.getItem("dafeiyu_avatar") || "0", 10);
  if (isNaN(avatarIndex) || avatarIndex < 0 || avatarIndex >= GALLERY.length) avatarIndex = 0;
  var seq = 0;
  var callbacks = {};
  var polling = false;
  var pollTimer = null;
  var pollDelay = 15000;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    dot.className = "dot " + (cls || "");
  }

  function setAvatar(index) {
    if (!GALLERY.length) return;
    avatarIndex = (index % GALLERY.length + GALLERY.length) % GALLERY.length;
    avatarEl.src = GALLERY[avatarIndex];
    localStorage.setItem("dafeiyu_avatar", String(avatarIndex));
    var thumbs = galleryGrid.querySelectorAll("img");
    for (var i = 0; i < thumbs.length; i++) {
      thumbs[i].className = (i === avatarIndex ? "active" : "");
    }
  }

  function buildGallery() {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < GALLERY.length; i++) {
      var im = document.createElement("img");
      im.src = GALLERY[i];
      im.alt = GALLERY[i];
      im.loading = "lazy";
      im.dataset.index = String(i);
      frag.appendChild(im);
    }
    galleryGrid.appendChild(frag);
  }

  function openGallery() {
    galleryPanel.classList.remove("hidden");
    galleryGrid.scrollTop = 0;
    setAvatar(avatarIndex);
  }

  function closeGallery() {
    galleryPanel.classList.add("hidden");
  }

  var bootStateValue = localStorage.getItem("dafeiyu_boot") || "unknown";

  function setBootUi(state) {
    bootStateValue = state;
    localStorage.setItem("dafeiyu_boot", state);
    bootToggle.classList.toggle("on", state === "on");
    bootToggle.textContent = state === "on" ? "关闭" :
      (state === "pending" ? "发送中…" : "开启");
    if (state === "on") {
      bootState.textContent = "已开启：下次重启，本鱼会自己回来。";
    } else if (state === "off") {
      bootState.textContent = "已关闭：下次重启不会自动启动。";
    } else if (state === "pending") {
      bootState.textContent = "正在发给手机上的 agent…";
    } else {
      bootState.textContent = "点右侧开启；需要 AutoX 自启动权限。";
    }
  }

  function openSettings() {
    settingsTopic.value = topic;
    setBootUi(bootStateValue);
    settingsPanel.classList.remove("hidden");
    settingsTopic.focus();
  }

  function closeSettings() {
    settingsPanel.classList.add("hidden");
  }

  async function sendBootCommand(cmd) {
    if (!topic) {
      setBootUi("unknown");
      add("assistant", "先保存 ntfy topic，再开启开机自启。", Date.now()/1000);
      return;
    }
    setBootUi("pending");
    try {
      var r = await nativeCall("publish", topic, cmd);
      if (!r.ok) {
        setBootUi("unknown");
        add("assistant", "开机自启命令发送失败：" + (r.body || r.status), Date.now()/1000);
      } else {
        add("assistant", cmd === "/boot on" ? "已发送开启请求，等她确认…" : "已发送关闭请求，等她确认…", Date.now()/1000);
      }
    } catch (e) {
      setBootUi("unknown");
      add("assistant", "开机自启命令发送失败：" + e.message, Date.now()/1000);
    }
  }

  avatarEl.addEventListener("click", function () {
    setAvatar(avatarIndex + 1);
  });
  galleryBtn.addEventListener("click", openGallery);
  galleryClose.addEventListener("click", closeGallery);
  galleryGrid.addEventListener("click", function (e) {
    if (e.target && e.target.dataset && e.target.dataset.index !== undefined) {
      setAvatar(parseInt(e.target.dataset.index, 10));
      closeGallery();
    }
  });

  bootBtn.addEventListener("click", openSettings);
  settingsClose.addEventListener("click", closeSettings);
  settingsPanel.addEventListener("click", function (e) {
    if (e.target === settingsPanel) closeSettings();
  });
  settingsSaveTopic.addEventListener("click", function () {
    var t = settingsTopic.value.trim();
    if (!t) return;
    topic = t;
    localStorage.setItem("dafeiyu_topic", topic);
    lastId = "10m";
    localStorage.setItem("dafeiyu_last_id", lastId);
    messages = [{role:"assistant", text:"换好频道啦，本鱼在。🐋", ts:Date.now()/1000}];
    render();
    closeSettings();
    schedulePoll(200);
  });
  bootToggle.addEventListener("click", function () {
    var wantOn = bootStateValue !== "on";
    var script = wantOn ? "/sdcard/PhoneAgent/boot_on.js" : "/sdcard/PhoneAgent/boot_off.js";
    var ran = false;
    try {
      if (window.Android && Android.runScript) {
        Android.runScript(script);
        ran = true;
      }
    } catch (e) {
      ran = false;
    }
    if (ran) {
      setBootUi(wantOn ? "on" : "off");
      add("assistant", wantOn ?
        "已让手机打开开机自启：下次重启，本鱼会自己回来。" :
        "已让手机关闭开机自启：下次重启不会自动启动。", Date.now()/1000);
    } else {
      sendBootCommand(wantOn ? "/boot on" : "/boot off");
    }
  });

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function fmtTime(ts) {
    try {
      var d = new Date((ts || Date.now()/1000) * 1000);
      return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
    } catch(e) { return ""; }
  }

  function render() {
    var out = [];
    for (var i=0;i<messages.length;i++) {
      var m = messages[i];
      out.push(
        '<div class="row ' + (m.role === "user" ? "me" : "her") + '">' +
        '<div class="bubble">' + esc(m.text) +
        '<div class="time">' + fmtTime(m.ts) + '</div></div></div>'
      );
    }
    main.innerHTML = out.join("");
    main.scrollTop = main.scrollHeight;
    localStorage.setItem("dafeiyu_msgs", JSON.stringify(messages.slice(-100)));
  }

  function add(role, text, ts) {
    var value = String(text);
    messages.push({role:role, text:value, ts:ts || Date.now()/1000});
    if (messages.length > 100) messages = messages.slice(-100);
    if (role === "assistant" && value.indexOf("开机自启") !== -1) {
      if (value.indexOf("已开启") !== -1) setBootUi("on");
      else if (value.indexOf("已关闭") !== -1) setBootUi("off");
    }
    render();
  }

  window.__nativeResult = function(id, ok, status, body) {
    var cb = callbacks[id];
    if (!cb) return;
    delete callbacks[id];
    cb({ok:!!ok, status:status||0, body:body||""});
  };

  function nativeCall(method) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject) {
      if (!window.Android || typeof window.Android[method] !== "function") {
        reject(new Error("native bridge not ready"));
        return;
      }
      var id = "cb" + (++seq);
      callbacks[id] = resolve;
      try {
        args.push(id);
        window.Android[method].apply(window.Android, args);
      } catch(e) {
        delete callbacks[id];
        reject(e);
      }
    });
  }

  function schedulePoll(ms) {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, ms);
  }

  async function poll() {
    if (polling) return;
    if (!topic) {
      setStatus("先填 topic", "off");
      schedulePoll(15000);
      return;
    }
    if (document.hidden) {
      schedulePoll(15000);
      return;
    }
    polling = true;
    try {
      var r = await nativeCall("poll", topic, lastId);
      if (!r.ok) {
        if (r.status === 400) {
          lastId = "10m";
          localStorage.setItem("dafeiyu_last_id", lastId);
          pollDelay = 1000;
        } else if (r.status === 429) {
          pollDelay = 60000;
          setStatus("限流，60 秒后重试", "off");
        } else {
          pollDelay = 20000;
          setStatus("连接失败", "off");
        }
        schedulePoll(pollDelay);
        return;
      }
      var lines = String(r.body || "").split("\n");
      var changed = false;
      for (var i=0;i<lines.length;i++) {
        var line = lines[i].trim();
        if (!line) continue;
        var msg;
        try { msg = JSON.parse(line); } catch(e) { continue; }
        if (msg.id) {
          lastId = msg.id;
          localStorage.setItem("dafeiyu_last_id", lastId);
        }
        if (msg.event !== "message") continue;
        var tags = msg.tags || [];
        var fromHer = msg.title === "Dafeiyu" || tags.indexOf("whale") !== -1;
        if (!fromHer) continue;
        var text = String(msg.message || "").trim();
        if (!text) continue;
        add("assistant", text, msg.time);
        changed = true;
      }
      setStatus(changed ? "新消息" : "在线", "on");
      if (changed) setTimeout(function(){ setStatus("在线","on"); }, 2500);
      pollDelay = 15000;
      schedulePoll(pollDelay);
    } catch(e) {
      setStatus("连接失败", "off");
      pollDelay = 20000;
      schedulePoll(pollDelay);
    } finally {
      polling = false;
    }
  }

  async function sendMessage() {
    var text = input.value.trim();
    if (!text) return;
    if (!topic) {
      add("assistant", "先点右上角 ⚙，把手机上 agent 的 ntfy topic 填进来。", Date.now()/1000);
      return;
    }
    input.value = "";
    input.style.height = "42px";
    add("user", text);
    send.disabled = true;
    try {
      var r = await nativeCall("publish", topic, text);
      if (!r.ok) add("assistant", "发送失败：" + (r.body || r.status), Date.now()/1000);
    } catch(e) {
      add("assistant", "发送失败：" + e.message, Date.now()/1000);
    } finally {
      send.disabled = false;
      schedulePoll(1500);
    }
  }

  function uploadPickedImage(file) {
    if (!file) return;
    if (!topic) {
      add("assistant", "先点右上角 ⚙，把 topic 填进来，再上传图片。", Date.now()/1000);
      return;
    }
    if (!/^image\//.test(file.type || "")) {
      add("assistant", "这个不是图片文件。", Date.now()/1000);
      return;
    }
    if (file.size > 12 * 1024 * 1024) {
      add("assistant", "图片太大了，先压到 12MB 以内。", Date.now()/1000);
      return;
    }
    var reader = new FileReader();
    reader.onload = async function() {
      attach.disabled = true;
      try {
        var r = await nativeCall("uploadImage", topic, String(reader.result), file.name || "upload.jpg");
        if (!r.ok) {
          add("assistant", "图片没传上去：" + (r.body || r.status), Date.now()/1000);
        } else {
          add("user", "🖼 " + (file.name || "图片") + " 已上传");
          setStatus("图片已上传，等她看", "on");
          schedulePoll(800);
        }
      } catch(e) {
        add("assistant", "图片没传上去：" + e.message, Date.now()/1000);
      } finally {
        attach.disabled = false;
        fileInput.value = "";
      }
    };
    reader.readAsDataURL(file);
  }

  attach.addEventListener("click", function() {
    fileInput.click();
  });
  fileInput.addEventListener("change", function() {
    if (fileInput.files && fileInput.files[0]) uploadPickedImage(fileInput.files[0]);
  });

  send.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener("input", function() {
    input.style.height = "42px";
    input.style.height = Math.min(110, input.scrollHeight) + "px";
  });

  document.getElementById("gear").addEventListener("click", openSettings);

  document.addEventListener("visibilitychange", function() {
    if (!document.hidden) {
      pollDelay = 15000;
      schedulePoll(200);
    }
  });

  setTimeout(function () {
    var splash = document.getElementById("splash");
    if (splash) splash.classList.add("hidden");
  }, 1400);
  buildGallery();
  setAvatar(avatarIndex);
  render();
  schedulePoll(500);
})();
</script>
</body>
</html>
